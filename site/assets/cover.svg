<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">如约 Ruyue — 认真说好，温柔做到。</title>
  <desc id="desc">如约 1.0.0 开源 Android 约定管理原型。奶油色背景与珊瑚色品牌标记，右侧为约定与进度的装饰性卡片插画。</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#DCCBBF" stroke-opacity=".28"/></pattern></defs>
  <rect width="1600" height="760" rx="28" fill="#FBF7EF"/>
  <path d="M906 0H1572Q1600 0 1600 28V732Q1600 760 1572 760H906Z" fill="#F1E7DA"/>
  <path d="M906 0H1572Q1600 0 1600 28V732Q1600 760 1572 760H906Z" fill="url(#grid)"/>
  <circle cx="1259" cy="366" r="263" fill="#EBCBB7"/>
  <circle cx="1259" cy="366" r="285" stroke="#C9957A" stroke-opacity=".45"/>
  <g transform="translate(84 64)"><rect width="66" height="66" rx="21" fill="#F5E5DC"/><g stroke="#A94E36" stroke-width="2.4"><ellipse cx="26" cy="33" rx="13" ry="18" transform="rotate(-27 26 33)"/><ellipse cx="40" cy="33" rx="13" ry="18" transform="rotate(27 40 33)"/></g><circle cx="33" cy="31" r="3" fill="#A94E36"/><text x="86" y="31" fill="#39352E" font-size="27" font-family="Microsoft YaHei, PingFang SC, sans-serif">如约</text><text x="88" y="54" fill="#8C7765" font-size="12" letter-spacing="5" font-family="Arial, sans-serif">RUYUE</text></g>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="88" y="287" fill="#39352E" font-size="86" font-weight="600" letter-spacing="3">认真说好。</text><text x="88" y="399" fill="#A94E36" font-size="86" font-weight="600" letter-spacing="3">温柔做到。</text><text x="91" y="472" fill="#776B60" font-size="23">给彼此一个清楚的约定，让每份心意有回音。</text></g>
  <text x="91" y="518" fill="#776B60" font-family="Georgia, serif" font-size="24" font-style="italic">Small promises. Thoughtfully kept.</text>
  <path d="M90 620H795" stroke="#DACEBF"/>
  <g font-family="Arial, sans-serif" font-size="14" letter-spacing="2"><text x="91" y="664" fill="#A94E36" font-weight="700">1.0.0</text><text x="184" y="664" fill="#776B60">ANDROID PREVIEW</text><text x="460" y="664" fill="#776B60">OPEN SOURCE · MIT</text></g>
  <g transform="translate(1022 158) rotate(-8 210 190)"><rect x="8" y="16" width="422" height="378" rx="22" fill="#9C7455" opacity=".11"/><rect width="422" height="378" rx="22" fill="#FFFCF7" stroke="#E1D3C2"/><rect x="30" y="30" width="98" height="28" rx="14" fill="#F6E7DC"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="46" y="49" fill="#A94E36" font-size="13">我们的约定</text><text x="31" y="116" fill="#39352E" font-size="30" font-weight="600">一起去看日落</text><text x="32" y="153" fill="#8A7C6D" font-size="15">把小小的期待，认真放在心上。</text></g><path d="M31 185H391" stroke="#EDE3D7"/><g stroke="#B78F68" stroke-width="2"><path d="M33 217l6 6 10-12"/><path d="M33 252l6 6 10-12"/></g><g font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#776B60"><text x="62" y="223">说清目标，也说好奖励</text><text x="62" y="258">每一步，都一起记得</text></g><rect x="30" y="292" width="362" height="54" rx="12" fill="#A94E36"/><text x="150" y="326" fill="#FFFCF7" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17">一起说好了</text></g>
  <g transform="translate(1161 510) rotate(7 165 63)"><rect x="4" y="9" width="335" height="126" rx="19" fill="#9C7455" opacity=".10"/><rect width="335" height="126" rx="19" fill="#FFFCF7" stroke="#DFCFBC"/><circle cx="45" cy="48" r="18" fill="#E6EAD9"/><path d="M37 48l6 6 11-12" stroke="#61714F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="55" fill="#39352E" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20">答应的事，一起做到。</text><text x="28" y="96" fill="#8A7C6D" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.7">A LITTLE PROMISE, MADE CLEAR.</text></g>
